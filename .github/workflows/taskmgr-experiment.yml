name: Task Manager experiment
on: pull_request
permissions:
  contents: read
jobs:
  look:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build
        working-directory: experiment
        run: |
          $t = $env:RUNNER_TEMP
          go build -ldflags=-H=windowsgui -o "$t\tree-a.exe" .
          # The same program under other names, to tell a name apart from a tree.
          foreach ($n in 'tree-a-other','svc-a','svc-a-other','svc-b','svc-b-other','svc-c','svc-c-other','svc-d','svc-d-other') { Copy-Item "$t\tree-a.exe" "$t\$n.exe" }
          icacls $t /grant "*S-1-5-19:(OI)(CI)RX" | Out-Null
      - name: Install Den-Watcher 2.0.10a with add-ons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 2.0.10a --repo $env:GITHUB_REPOSITORY --pattern '*x64.msi' --dir msi
          $msi = (Get-ChildItem msi\*.msi)[0].FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn KERNEL=1 MEMORY=1 PORTS=1" -PassThru
          $p.WaitForExit(300000) | Out-Null
          Write-Host "msiexec exit $($p.ExitCode)"
      - name: Start the test parents
        run: |
          $t = $env:RUNNER_TEMP
          $ping = "$env:WINDIR\System32\PING.EXE"
          # A: a background program; children of another exe, one a Windows program.
          Start-Process "$t\tree-a.exe" -ArgumentList spawn,nojob,"$t\tree-a-other.exe",$ping
          function Svc($name, $exe, $mode, $obj, $kids) {
            $bin = "`"$t\$exe.exe`" service $mode " + (($kids | ForEach-Object { "`"$_`"" }) -join ' ')
            if ($obj) { sc.exe create $name binPath= $bin obj= $obj | Out-Null } else { sc.exe create $name binPath= $bin | Out-Null }
            sc.exe start $name | Out-Null
          }
          # B: LocalService, plain (as in the run before).
          Svc TmA svc-a nojob 'NT AUTHORITY\LocalService' @("$t\svc-a.exe", "$t\svc-a-other.exe")
          # C: LocalSystem, plain (svc-b-other showed flat before).
          Svc TmB svc-b nojob $null @("$t\svc-b.exe", "$t\svc-b-other.exe")
          # D: LocalService, children in a kill-on-close job, as den-watcher does.
          Svc TmC svc-c job 'NT AUTHORITY\LocalService' @("$t\svc-c.exe", "$t\svc-c-other.exe")
          # E: LocalService, a child of another exe and a Windows program.
          Svc TmD svc-d nojob 'NT AUTHORITY\LocalService' @("$t\svc-d-other.exe", $ping)
          Start-Sleep 8
          Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'tree-*' -or $_.Name -like 'svc-*' -or $_.Name -like 'den-watcher*' -or $_.Name -eq 'PING.EXE' } | Select-Object ProcessId, ParentProcessId, SessionId, Name | Format-Table -AutoSize
      - name: Open Task Manager
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Start-Process taskmgr
          Start-Sleep 8
          $root = [Windows.Automation.AutomationElement]::RootElement
          $more = $root.FindFirst([Windows.Automation.TreeScope]::Descendants,
            (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, 'More details')))
          if ($more) { ($more.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern)).Invoke() }
          Start-Sleep 10
      - name: Dump Task Manager's process list
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Drawing, System.Windows.Forms
          $tm = Get-Process taskmgr | Select-Object -First 1
          $win = [Windows.Automation.AutomationElement]::FromHandle($tm.MainWindowHandle)
          $walker = [Windows.Automation.TreeWalker]::ControlViewWalker
          # Expand every group so its children show.
          $all = $win.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition)
          foreach ($e in $all) {
            try {
              $p = $e.GetCurrentPattern([Windows.Automation.ExpandCollapsePattern]::Pattern)
              if ($p.Current.ExpandCollapseState -eq 'Collapsed') { $p.Expand() }
            } catch {}
          }
          Start-Sleep 3
          function Walk($el, $depth) {
            if ($depth -gt 30) { return }
            $c = $walker.GetFirstChild($el)
            while ($c) {
              $n = $c.Current.Name
              $t = $c.Current.ControlType.ProgrammaticName -replace 'ControlType.', ''
              if ($t -in 'TreeItem','DataItem','ListItem','Group' -and $n) {
                $lvl = ''
                try { $lvl = $c.GetCurrentPropertyValue([Windows.Automation.AutomationElement]::LevelProperty) } catch {}
                Write-Host ("{0}{1} [{2} level={3}]" -f ('  ' * $depth), $n, $t, $lvl)
              }
              Walk $c ($depth + 1)
              $c = $walker.GetNextSibling($c)
            }
          }
          Walk $win 0
