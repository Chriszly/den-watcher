@let several = devices.devices().length > 1;
@if (several) {
  <app-sidebar [label]="i18n.t('devices.label')">
    <app-device-picker [compact]="sidebar.compact()" />
  </app-sidebar>
}
<main>
  <header>
    @if (several) {
      <button
        type="button"
        class="menu"
        [attr.aria-expanded]="sidebar.open()"
        [title]="i18n.t('sidebar.open')"
        (click)="sidebar.open.set(true)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z" />
        </svg>
        <span class="visually-hidden">{{ i18n.t('sidebar.open') }}</span>
      </button>
    }
    <button
      type="button"
      class="mascot"
      (click)="theme.toggle()"
      [attr.aria-label]="themeToggleLabel()"
      [title]="themeToggleLabel()"
    >
      <app-mascot />
    </button>
    <h1>Den-Watcher</h1>
    <app-alerts-button />
    <app-language-switcher />
  </header>
  <app-connection-banner />
  <app-update-notice />
  @if (!several) {
    <app-manage-button />
  }
  @if (devices.comparing() && several) {
    <!-- The comparison is loaded only when it is opened, so the page loads fast. -->
    @defer {
      <app-compare />
    }
  } @else {
    <app-dashboard />
    <app-history />
  }
</main>
