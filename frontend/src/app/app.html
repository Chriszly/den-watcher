<main>
  <header>
    <button
      type="button"
      class="mascot"
      (click)="theme.toggle()"
      [attr.aria-label]="themeToggleLabel()"
      [title]="themeToggleLabel()"
    >
      <app-mascot />
    </button>
    <h1>Den-Watcher</h1>
    <app-alerts-button />
    <app-language-switcher />
  </header>
  <app-connection-banner />
  <app-update-notice />
  <app-device-picker />
  @if (devices.comparing() && devices.devices().length > 1) {
    <!-- The comparison is loaded only when it is opened, so the page loads fast. -->
    @defer {
      <app-compare />
    }
  } @else {
    <app-dashboard />
    <app-history />
  }
</main>
