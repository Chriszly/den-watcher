<button
  type="button"
  class="compare"
  [attr.aria-pressed]="devices.comparing()"
  [title]="i18n.t('compare.title')"
  (click)="devices.comparing.set(true)"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" />
  </svg>
  <span [class.visually-hidden]="compact()">{{ i18n.t('compare.title') }}</span>
</button>
@for (group of groups(); track group.kind) {
  <section [attr.aria-labelledby]="'device-group-' + group.kind">
    <h2 [id]="'device-group-' + group.kind">{{ i18n.t(`devices.group.${group.kind}`) }}</h2>
    <ul>
      @for (device of group.devices; track device.id) {
        <li>
          <app-device-item
            [device]="device"
            [summary]="fleet.summaries().get(device.id)"
            [selected]="!devices.comparing() && device.id === devices.selectedId()"
            [compact]="compact()"
            (picked)="devices.show(device.id)"
          />
        </li>
      }
    </ul>
  </section>
}
<app-manage-button [compact]="compact()" />
