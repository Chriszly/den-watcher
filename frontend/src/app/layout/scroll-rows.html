<!-- While it scrolls, the list takes the focus, so the arrow keys scroll it both ways. -->
@if (scrolls()) {
  <button
    type="button"
    class="less"
    [class.hidden]="!above()"
    [attr.aria-label]="i18n.t('dashboard.moreAbove')"
    [title]="i18n.t('dashboard.moreAbove')"
    (click)="scrollUp()"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z" fill="currentColor" />
    </svg>
  </button>
}
<div
  #list
  class="list"
  [class.lock]="locks()"
  [attr.tabindex]="scrolls() ? 0 : null"
  (scroll)="update()"
>
  <ng-content />
</div>
@if (scrolls()) {
  <button
    type="button"
    class="more"
    [class.hidden]="!more()"
    [attr.aria-label]="i18n.t('dashboard.moreBelow')"
    [title]="i18n.t('dashboard.moreBelow')"
    (click)="scrollDown()"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z" fill="currentColor" />
    </svg>
  </button>
}
